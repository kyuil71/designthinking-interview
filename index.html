<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Research Lab.</title>
  <!-- 홈 화면에 추가해 실행하면 주소창 없이 전체 화면으로 열림 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- default: 아이폰 홈 화면 실행 시 상단 메뉴가 시계·배터리 표시줄과 겹치지 않도록 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Research Lab" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

  <style>
    /* 당겨서 새로고침 막기 — 안드로이드 크롬은 html(루트 스크롤)에 지정해야 적용됨 */
    html, body { overscroll-behavior: none; }
    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      background-color: #ffffff;
      font-size: 16px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .bg-dark-navy { background-color: #0f172a; }
    .bg-quote-gray { background-color: #f8fafc; }
    .border-card { border-color: #f1f5f9; }
    .hero-title { font-size: 13.5vw; line-height: 1.1; }
    @media (min-width: 430px) { .hero-title { font-size: 58px; } }
    .btn-active:active { transform: scale(0.98); transition: all 0.1s; }
    @keyframes scale-in { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-scale-in { animation: scale-in 0.18s ease-out forwards; }
    /* 분석 중 표시 — 트렌드 인사이트 랩과 동일. '동작 줄이기' 설정에서도 반드시 회전 */
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    .spinner-ring {
      width: 84px; height: 84px; border-radius: 50%;
      border: 7px solid #e2e8f0; border-top-color: #2563eb; border-right-color: #2563eb;
      animation: spinner-rotate 0.9s linear infinite;
      will-change: transform;
    }
    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner-ring), *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
      .spinner-ring { animation-duration: 1.4s !important; }
    }
    /* 하단 고정 버튼 영역 — 아이폰 홈 바(safe-area)만큼 여백 확보 */
    .dock { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    .dock-space { padding-bottom: calc(128px + env(safe-area-inset-bottom)); }
    .dock-space-2 { padding-bottom: calc(196px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    (async function() {
      // --- CONFIG & CONSTANTS ---
      const MODEL_NAME = "gemini-flash-latest";
      const SESSION_KEY_API = "research_lab_api_key_v31";
      const LEGACY_STORAGE_KEY = "research_lab_saved_state_v31";   // 이전 버전(단일 저장) — 처음 실행 시 목록으로 옮김
      const PROJECTS_KEY = "research_lab_projects_v32";
      const MAX_PROJECTS = 5;
      const AUTOSAVE_MS = 5000;

      // 단계 정의 — 상단 진행 표시줄에 사용
      const STAGES = [
        { n: 1, label: "주제 설정" },
        { n: 2, label: "타겟 제안" },
        { n: 3, label: "타겟 선택" },
        { n: 4, label: "질문 설계" },
        { n: 5, label: "인터뷰 확정" },
        { n: 6, label: "인터뷰 결과" }
      ];

      // --- PROMPT TEMPLATES ---
      const PROMPTS = {
        GENERATE_PERSONAS: (topic) => `You are a Senior UX/User Researcher with 15 years of experience. 
        Topic: "${topic}". Suggest exactly 10 diverse and highly professional target personas. 
        [GOAL] Create rich, multi-dimensional user profiles that go beyond surface-level stereotypes. 
        [STYLE] Use professional yet clear Korean suitable for design strategy documents. 
        [STRICT FORMATTING RULE] Provide exactly 10 personas in the specified JSON structure.
        - "name": "[인물 특성을 관통하는 전문적인 수식어] ([카테고리]): [구체적 연령/연령대]"
        - "description": "[직업적 전문성, 일상의 리얼리티, 가치관, 디지털 리터러시, 사회적 관계성 및 행동 양식을 포함한 풍부한 맥락 설명 (3-4문장)]"
        - "needs": "[해결하고자 하는 구체적인 기능적/정서적/심리적 요구 사항]"
        Return JSON object: { "personas": [{ "id": "uuid", "name": "Name", "description": "Description", "needs": "Needs" }] }.`,
        
        GENERATE_SURVEYS: (topic, persona) => `You are an Expert UX Interviewer. Topic: "${topic}". Persona: "${persona.name}".
        Suggest exactly 15 in-depth interview questions organized into 3 categories (5 per category). 
        [STYLE] Write in clear, straightforward, and conversational Korean. 
        Return JSON: { "surveys": [{ "id": "uuid", "title": "Category Title", "questions": ["Question 1", "Question 2", "..."] }] }.`,

        GENERATE_INTERVIEW: (topic, persona, questions) => `You are a Virtual User named ${persona.name}. Topic: "${topic}". 
        Context: ${persona.description}. Needs: ${persona.needs}.
        Answer ALL the following questions realistically as this persona:
        ${questions.map((q, i) => `${i+1}. ${q}`).join("\n")}
        [RULE] 각 질문에 대한 답변은 5문장 정도로 매우 상세하게 작성해 주세요. 답변에는 페르소나의 성격이 드러나는 구체적인 일상 에피소드나 과거의 직접적인 경험담을 반드시 포함하여 답변의 현장감과 설득력을 높여주세요. Do NOT use markdown bold (**). Use natural, conversational Korean. 
        [FORMAT] For "keyInsights", use 1) 2) 3) format.
        Return JSON: { "summary": "Full session summary", "qaPairs": [{ "q": "Question Text", "a": "Answer Text" }], "keyInsights": "1) ... \\n 2) ..." }.`,

        NAME_CLUSTERS: (topic, clusters) => `You are a Senior UX Researcher doing affinity mapping. Topic: "${topic}".
        Below are groups of interview sentences already clustered by meaning. For each group, write a short Korean theme title (under 20 characters) and one insight sentence that explains what the group reveals about users.
        ${clusters.map(c => `[group ${c.id}] (${c.size} sentences from ${c.people} interviewees)\n${c.samples.map(x => "- " + x).join("\n")}`).join("\n\n")}
        [RULE] Natural Korean. No markdown bold (**). Keep every group id.
        Return JSON: { "clusters": [{ "id": 0, "title": "Theme", "insight": "One sentence" }] }.`,

        GENERATE_FOLLOW_UP: (topic, persona, question) => `You are ${persona.name}. Topic: "${topic}".
        Answer the follow-up question: "${question}" in your persona's tone. 
        [RULE] Easy Korean. No markdown bold (**).
        Return JSON: { "q": "${question}", "a": "Answer" }.`
      };

      const uid = () => "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // --- 저장소 — 트렌드 인사이트 랩과 같은 슬롯 방식(최대 5개) + 용량 처리 ---
      const Store = {
        list() {
          try {
            const raw = localStorage.getItem(PROJECTS_KEY);
            const arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
          } catch (e) { console.warn("저장 목록을 읽지 못했습니다.", e); return []; }
        },
        _write(list) {
          try { localStorage.setItem(PROJECTS_KEY, JSON.stringify(list)); return true; }
          catch (e) { return false; }
        },
        save(snapshot, meta) {
          let list = Store.list().filter(p => p.id !== meta.id);
          list.unshift({ id: meta.id, title: meta.title, savedAt: Date.now(), data: snapshot });
          if (list.length > MAX_PROJECTS) list = list.slice(0, MAX_PROJECTS);
          if (Store._write(list)) return { ok: true };
          // 용량 초과: 가장 오래된 프로젝트를 버리고 재시도
          const reduced = list.slice(0, Math.max(1, list.length - 1));
          if (Store._write(reduced)) return { ok: true, pruned: "oldest" };
          return { ok: false };
        },
        remove(id) { return Store._write(Store.list().filter(p => p.id !== id)); }
      };

      // 이전 버전에서 저장한 단일 프로젝트를 목록으로 옮김 (한 번만)
      (function migrateLegacy() {
        try {
          const old = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (!old) return;
          const data = JSON.parse(old);
          if (Store.list().length === 0 && data && (data.researchTopic || (data.aiPersonas || []).length)) {
            const id = uid();
            Store._write([{ id, title: (data.researchTopic || "이전 프로젝트").slice(0, 40), savedAt: Date.now(), data: { ...data, projectId: id } }]);
          }
          localStorage.removeItem(LEGACY_STORAGE_KEY);
        } catch (e) { /* 무시 */ }
      })();

      function blankProject() {
        return {
          projectId: uid(),
          maxStepReached: 1,
          researchTopic: "",
          aiPersonas: [],
          manualPersonas: [],
          selectedPersonaId: null,
          aiSurveys: [],
          manualSurveys: [],
          selectedQuestionIds: [],
          history: [],
          personaInfo: {},      // 임베딩: 타겟별 주제 적합도·성향·중복
          questionInfo: {},     // 임베딩: 질문별 관련도·중복
          affinity: null        // 임베딩: 전체 인터뷰 인사이트 묶음
        };
      }

      // --- GLOBAL STATE ---
      let state = {
        apiKey: sessionStorage.getItem(SESSION_KEY_API) || "",
        step: -1,
        isAnalyzing: false,
        loadingMsg: "",
        errorMsg: null,
        embedBusy: "",
        ...blankProject(),
        maxStepReached: -1
      };

      window.state = state;

      // --- STATE MANAGEMENT ---
      function setState(newState) {
        const prevStep = state.step;
        if (newState.step !== undefined) state.maxStepReached = Math.max(state.maxStepReached, newState.step);
        state = { ...state, ...newState }; 
        window.state = state;
        render(); 
        if (newState.step !== undefined && newState.step !== prevStep) window.scrollTo(0, 0);
      }
      window.setState = setState;

      // --- 자동 저장 ---
      let lastSaved = "";
      let quotaWarned = false;

      function snapshotOf(s) {
        const { apiKey, isAnalyzing, loadingMsg, errorMsg, embedBusy, ...data } = s;
        return data;
      }
      function projectTitle() {
        if (state.researchTopic) return state.researchTopic.slice(0, 40);
        return "제목 없는 프로젝트";
      }
      // 저장해 둔 단계가 데이터와 맞지 않으면 갈 수 있는 마지막 단계로 보정
      function resumeStep(d) {
        const has = (a) => Array.isArray(a) && a.length > 0;
        const hasPersonas = has(d.aiPersonas) || has(d.manualPersonas);
        const ok = {
          1: true,
          2: hasPersonas,
          3: hasPersonas,
          4: !!d.selectedPersonaId && (has(d.aiSurveys) || has(d.manualSurveys)),
          5: !!d.selectedPersonaId && has(d.selectedQuestionIds),
          6: has(d.history)
        };
        let s = parseInt(d.step, 10);
        if (!(s >= 1 && s <= 6)) s = 6;
        while (s > 1 && !ok[s]) s--;
        return s;
      }
      function persist(force) {
        if (state.step < 1) return "skip";
        // 주제도 결과도 없는 빈 프로젝트는 목록을 차지하지 않도록 저장하지 않음
        if (!state.researchTopic && !state.aiPersonas.length && !state.manualPersonas.length) return "skip";
        const snap = snapshotOf(state);
        const serialized = JSON.stringify(snap);
        if (!force && serialized === lastSaved) return "skip";
        const r = Store.save(snap, { id: state.projectId, title: projectTitle() });
        if (r.ok) {
          lastSaved = serialized;
          if (r.pruned === "oldest" && !quotaWarned) { quotaWarned = true; showToast("공간 확보를 위해 가장 오래된 프로젝트를 정리했습니다."); }
          return "ok";
        }
        if (!quotaWarned) { quotaWarned = true; showToast("저장 공간이 부족해 자동 저장이 중단되었습니다."); }
        return "full";
      }

      // --- AI 호출 — 취소 / 파싱 방어 / 치명적 오류 즉시 중단 (트렌드 인사이트 랩과 동일) ---
      let activeController = null;

      function parseModelJson(text) {
        let t = String(text).trim();
        t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
        try { return JSON.parse(t); } catch (e) { /* 아래에서 구간 추출 재시도 */ }
        const first = Math.min(...[t.indexOf("{"), t.indexOf("[")].filter(i => i >= 0));
        const last = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
        if (Number.isFinite(first) && last > first) {
          try { return JSON.parse(t.slice(first, last + 1)); } catch (e) { /* fallthrough */ }
        }
        throw new Error("AI 응답을 JSON으로 해석하지 못했습니다. 다시 시도해 주세요.");
      }

      async function callGemini(systemPrompt, userPrompt) {
        const controller = new AbortController();
        activeController = controller;
        const delays = [1000, 2000, 4000, 8000];
        let lastError = "알 수 없는 오류";

        for (let i = 0; i <= delays.length; i++) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${encodeURIComponent(state.apiKey || "")}`, {
              method: "POST",
              signal: controller.signal,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
              })
            });
            if (!res.ok) {
              const err = new Error(`요청이 거부되었습니다 (상태 ${res.status}).`);
              err.fatal = [400, 401, 403, 404].includes(res.status);
              throw err;
            }
            const data = await res.json();
            const cand = data && data.candidates && data.candidates[0];
            if (cand && cand.finishReason === "MAX_TOKENS") {
              throw new Error("응답이 최대 길이에 도달해 잘렸습니다. 선택한 질문 수를 줄이고 다시 시도해 주세요.");
            }
            const text = cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text;
            if (!text) throw new Error("AI가 빈 응답을 반환했습니다.");
            return parseModelJson(text);
          } catch (err) {
            if (err.name === "AbortError") { const e = new Error("__aborted__"); e.aborted = true; throw e; }
            lastError = err.message;
            if (err.fatal || i === delays.length) break;
            await new Promise(r => setTimeout(r, delays[i]));
          }
        }
        throw new Error(lastError);
      }

      // 단계별 로딩 메시지를 띄우고 작업이 끝나면 닫음
      async function withLoading(msg, fn) {
        setState({ isAnalyzing: true, loadingMsg: msg, errorMsg: null });
        try {
          const out = await fn();
          setState({ isAnalyzing: false });
          return out;
        } catch (err) {
          if (err && err.aborted) { setState({ isAnalyzing: false }); showToast("분석을 취소했습니다."); return null; }
          console.error(err);
          setState({ isAnalyzing: false, errorMsg: err.message || "분석에 실패했습니다." });
          return null;
        } finally {
          activeController = null;
        }
      }

      // --- 임베딩 (gemini-embedding-2) — 고르는 일은 임베딩, 생각하는 일은 Flash ---
      // 벡터는 메모리에만 두고(용량 절약), 계산 결과(점수·묶음)만 프로젝트에 저장
      const EMBED_MODEL = "gemini-embedding-2";
      const EMBED_DIM = 768;            // 768차원: 품질 손실이 적고 저장·계산이 가벼움
      const EMBED_BATCH = 100;          // batchEmbedContents 한 번에 보낼 최대 개수
      const DUP_PERSONA = 0.92;         // 이 값 이상이면 '비슷한 타겟'으로 표시
      const DUP_QUESTION = 0.90;        // 이 값 이상이면 '비슷한 질문'으로 표시
      const ARCHETYPES = [
        { key: "GENERAL", label: "일반 사용자", text: "평범한 일상 속에서 제품을 무난하게 쓰는 다수의 보통 사용자. 특별한 불만이나 열정 없이 익숙한 방식을 따른다." },
        { key: "LEAD", label: "리드 유저", text: "남들보다 먼저 새로운 기술과 방법을 시도하고 스스로 해결책을 만들어 쓰는 앞선 사용자. 미래의 요구를 먼저 겪는다." },
        { key: "EXTREME", label: "익스트림 유저", text: "아주 많이 쓰거나 전혀 쓰지 못하는 극단의 사용자. 신체적·환경적 제약이나 강한 불편 때문에 문제를 크게 겪는다." },
        { key: "DESIRE", label: "욕구 중심 유저", text: "기능보다 감정과 취향, 자기표현, 지위와 같은 내면의 욕구가 선택을 이끄는 사용자. 갖고 싶다는 마음이 행동을 만든다." }
      ];

      const vecCache = new Map();       // 텍스트 → 정규화된 벡터

      function normalize(v) {
        let s = 0; for (let i = 0; i < v.length; i++) s += v[i] * v[i];
        const n = Math.sqrt(s) || 1;
        const out = new Float32Array(v.length);
        for (let i = 0; i < v.length; i++) out[i] = v[i] / n;
        return out;
      }
      function cos(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
      function meanVec(vs) {
        const m = new Float32Array(vs[0].length);
        vs.forEach(v => { for (let i = 0; i < m.length; i++) m[i] += v[i]; });
        return normalize(m);
      }

      async function embedTexts(texts) {
        const todo = [...new Set(texts.filter(t => !vecCache.has(t)))];
        for (let i = 0; i < todo.length; i += EMBED_BATCH) {
          const chunk = todo.slice(i, i + EMBED_BATCH);
          let res;
          for (let attempt = 0; attempt < 3; attempt++) {
            res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${EMBED_MODEL}:batchEmbedContents?key=${encodeURIComponent(state.apiKey || "")}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                requests: chunk.map(text => ({ model: `models/${EMBED_MODEL}`, content: { parts: [{ text }] }, outputDimensionality: EMBED_DIM }))
              })
            });
            if (res.ok || [400, 401, 403, 404].includes(res.status)) break;
            await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
          }
          if (!res.ok) throw new Error(`임베딩 요청이 거부되었습니다 (상태 ${res.status}).`);
          const data = await res.json();
          const embs = (data && data.embeddings) || [];
          if (embs.length !== chunk.length) throw new Error("임베딩 응답 개수가 맞지 않습니다.");
          chunk.forEach((t, j) => vecCache.set(t, normalize(embs[j].values)));
        }
        return texts.map(t => vecCache.get(t));
      }

      const personaText = (p) => `${p.name}\n${p.description}\n니즈: ${p.needs}`;
      const allPersonas = () => [...state.aiPersonas, ...state.manualPersonas];
      let embedWarned = false;
      function embedFailed(err) {
        console.warn("임베딩 실패", err);
        if (!embedWarned) { embedWarned = true; showToast("임베딩 분석을 건너뛰었습니다. 기본 기능은 그대로 쓸 수 있습니다."); }
      }

      // 타겟 분석: 주제 적합도 + 성향 추정 + 비슷한 타겟 표시 (배경에서 실행, 화면을 막지 않음)
      let personaRun = 0;
      async function analyzePersonas() {
        const ps = allPersonas();
        if (!state.researchTopic || ps.length === 0 || !state.apiKey) return;
        const run = ++personaRun;
        setState({ embedBusy: "타겟 적합도 계산 중" });
        try {
          const [topicV, ...rest] = await embedTexts([state.researchTopic, ...ps.map(personaText), ...ARCHETYPES.map(a => a.text)]);
          if (run !== personaRun) return;
          const pv = rest.slice(0, ps.length);
          const av = rest.slice(ps.length);
          // 성향: 각 원형과의 유사도에서 타겟 전체 평균을 빼서 '주제 공통 성분'을 걷어낸 뒤 가장 두드러진 원형을 고름
          const raw = pv.map(v => av.map(a => cos(v, a)));
          const avg = av.map((_, k) => raw.reduce((s, r) => s + r[k], 0) / raw.length);
          const scores = ps.map((p, i) => cos(topicV, pv[i]));
          const sorted = [...scores].sort((a, b) => b - a);
          const tier = (s) => {
            const r = sorted.indexOf(s) / Math.max(1, sorted.length - 1);
            return r <= 0.34 ? "높음" : r <= 0.67 ? "보통" : "낮음";
          };
          const personaInfo = {};
          ps.forEach((p, i) => {
            const centered = raw[i].map((x, k) => x - avg[k]);
            const best = centered.indexOf(Math.max(...centered));
            let dupOf = null, dupSim = 0;
            ps.forEach((q, j) => { if (j !== i) { const s = cos(pv[i], pv[j]); if (s > dupSim) { dupSim = s; dupOf = j; } } });
            personaInfo[p.id] = {
              score: +scores[i].toFixed(3),
              tier: tier(scores[i]),
              arch: ps.length >= 3 ? ARCHETYPES[best].label : null,
              dupWith: dupSim >= DUP_PERSONA ? dupOf + 1 : null
            };
          });
          setState({ personaInfo, embedBusy: "" });
        } catch (err) {
          if (run === personaRun) setState({ embedBusy: "" });
          embedFailed(err);
        }
      }

      // 질문 분석: 주제+선택 타겟 니즈와의 관련도, 비슷한 질문 표시
      function allQuestions() {
        const out = [];
        [...state.aiSurveys, ...state.manualSurveys].forEach(s => s.questions.forEach((q, idx) => out.push({ id: `${s.id}-${idx}`, text: q })));
        return out;
      }
      let questionRun = 0;
      async function analyzeQuestions() {
        const qs = allQuestions();
        const persona = allPersonas().find(p => p.id === state.selectedPersonaId);
        if (!qs.length || !persona || !state.apiKey) return;
        const run = ++questionRun;
        setState({ embedBusy: "질문 관련도 계산 중" });
        try {
          const ctx = `${state.researchTopic}\n${persona.name}\n니즈: ${persona.needs}`;
          const [ctxV, ...qv] = await embedTexts([ctx, ...qs.map(q => q.text)]);
          if (run !== questionRun) return;
          const questionInfo = {};
          qs.forEach((q, i) => {
            let dupOf = null, dupSim = 0;
            for (let j = 0; j < i; j++) { const s = cos(qv[i], qv[j]); if (s > dupSim) { dupSim = s; dupOf = j; } }
            questionInfo[q.id] = { rel: +cos(ctxV, qv[i]).toFixed(3), dupWith: dupSim >= DUP_QUESTION ? qs[dupOf].id : null };
          });
          setState({ questionInfo, embedBusy: "" });
        } catch (err) {
          if (run === questionRun) setState({ embedBusy: "" });
          embedFailed(err);
        }
      }

      // 질문 추천: 관련도와 다양성을 함께 보는 MMR 방식으로 N개 자동 선택
      function mmrPick(rel, sim, n, lambda = 0.7) {
        const picked = [], left = rel.map((_, i) => i);
        while (picked.length < n && left.length) {
          let bi = 0, bs = -Infinity;
          left.forEach((i, li) => {
            const red = picked.length ? Math.max(...picked.map(j => sim(i, j))) : 0;
            const s = lambda * rel[i] - (1 - lambda) * red;
            if (s > bs) { bs = s; bi = li; }
          });
          picked.push(left.splice(bi, 1)[0]);
        }
        return picked;
      }

      // 인사이트 묶기: 평균 연결 계층 군집 (문장 수가 수백 개 이내라 폰에서도 충분히 빠름)
      function clusterVectors(vs, k) {
        // 평균 연결: 합칠 때마다 거리 행렬 전체를 다시 계산하지 않고 크기 가중 평균으로 갱신
        const n = vs.length;
        const L = vs.map(a => Float64Array.from(vs, b => cos(a, b)));
        const members = vs.map((_, i) => [i]);
        const alive = new Set(members.map((_, i) => i));
        while (alive.size > k) {
          let bi = -1, bj = -1, bs = -Infinity;
          for (const i of alive) for (const j of alive) if (i < j && L[i][j] > bs) { bs = L[i][j]; bi = i; bj = j; }
          const na = members[bi].length, nb = members[bj].length;
          for (const x of alive) if (x !== bi && x !== bj) {
            const v = (na * L[bi][x] + nb * L[bj][x]) / (na + nb);
            L[bi][x] = v; L[x][bi] = v;
          }
          members[bi] = members[bi].concat(members[bj]);
          alive.delete(bj);
        }
        return [...alive].map(i => members[i]);
      }
      function splitSentences(text) {
        return String(text || "").split(/(?<=[.!?。])\s+|\n+/).map(s => s.trim()).filter(s => s.length >= 12);
      }

      // --- ACTIONS ---
      const Actions = {
        async validateKey() {
          const input = document.getElementById('api-input');
          let keyToUse = input?.value || state.apiKey;
          if (!keyToUse) { showToast("API 키를 입력해 주세요."); return; }
          
          setState({ apiKey: keyToUse });
          const test = await withLoading("키를 확인하는 중", () => callGemini("Return JSON: {\"status\":\"OK\"}", "Test Connection"));
          if (test) {

            setState({ step: 0 });
          } else {

            setState({ apiKey: "", errorMsg: state.errorMsg ? "유효하지 않은 API 키입니다.\n" + state.errorMsg : null });
          }
        },

        openProject(id) {

          // 이전 버전에서 저장한 프로젝트는 임베딩 분석을 새로 채움
          if (allPersonas().some(p => !(state.personaInfo || {})[p.id])) analyzePersonas();
          if (state.selectedPersonaId && [...state.aiSurveys, ...state.manualSurveys].length && !Object.keys(state.questionInfo || {}).length) analyzeQuestions();
        },

        deleteProject(id) {
          if (!confirm("이 프로젝트를 삭제할까요? 되돌릴 수 없습니다.")) return;
          showToast(Store.remove(id) ? "프로젝트를 삭제했습니다." : "삭제에 실패했습니다.");
          render();
        },

        goHome() {

          persist(true);
          setState({ step: 0 });
        },

        startNewProject() {

        },

        cancel() { if (activeController) activeController.abort(); },

        async generatePersonas(instruction = "") {
          const userPrompt = instruction ? `Topic: ${state.researchTopic}. Instruction: ${instruction}` : state.researchTopic;
          const res = await withLoading(instruction ? "수정 지시를 반영해 타겟을 다시 제안하고 있습니다" : "주제에 맞는 인터뷰 타겟 10명을 찾고 있습니다",
            () => callGemini(PROMPTS.GENERATE_PERSONAS(state.researchTopic), userPrompt));
          if (res) { setState({ aiPersonas: res.personas, personaInfo: {}, step: 2 }); analyzePersonas(); }
        },

        addManualPersona() {
          const nameInput = document.getElementById('manual-p-name');
          const descInput = document.getElementById('manual-p-desc');
          const name = nameInput?.value.trim();

          if (!name) { showToast("이름 또는 제목을 입력해주세요."); return; }
          const newPersona = { id: 'm' + Date.now(), name: name, description: desc || "설명 정보가 없습니다.", needs: desc || "구체적인 니즈 정보가 없습니다." };
          setState({ manualPersonas: [...state.manualPersonas, newPersona] });
          analyzePersonas();
          if (nameInput) nameInput.value = '';
          if (descInput) descInput.value = '';
        },

        addManualQuestions() {
          const input = document.getElementById('manual-q-input');
          const v = input?.value;
          if (v) {
            const list = v.split('\n').map(x => x.trim()).filter(x => x);

            setState({
              manualSurveys: [...state.manualSurveys, { id: nid, title: '사용자 추가 질문', questions: list }],

        },

        async generateSurveys() {
          const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === state.selectedPersonaId);
          const res = await withLoading("선택한 타겟에 맞는 인터뷰 질문을 설계하고 있습니다",
            () => callGemini(PROMPTS.GENERATE_SURVEYS(state.researchTopic, persona), "Generate questions."));
          if (res) { setState({ aiSurveys: res.surveys, questionInfo: {}, step: 4 }); analyzeQuestions(); }
        },
        
        async performInterview() {
          const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === state.selectedPersonaId);
          const allQ = []; [...state.aiSurveys, ...state.manualSurveys].forEach(s => s.questions.forEach((q, idx) => allQ.push({ id: `${s.id}-${idx}`, text: q })));
          const selectedTexts = allQ.filter(q => state.selectedQuestionIds.includes(q.id)).map(q => q.text);
          if (selectedTexts.length === 0) { showToast("질문을 선택해 주세요."); return; }
          const res = await withLoading(`선택한 타겟과 ${selectedTexts.length}개 질문으로\n가상 인터뷰를 진행하고 있습니다`,
            () => callGemini(PROMPTS.GENERATE_INTERVIEW(state.researchTopic, persona, selectedTexts), "Start interview."));
          if (res) setState({ history: [...state.history, { personaId: persona.id, result: res }], step: 6 });
        },
        
        // 관련도·다양성을 함께 보고 질문 N개 자동 선택 (기존 선택은 바뀜)
        autoPickQuestions(n = 8) {
          const qs = allQuestions();
          const info = state.questionInfo || {};
          if (!qs.length || qs.some(q => !info[q.id])) { showToast("질문 관련도를 계산하는 중입니다. 잠시 후 다시 눌러 주세요."); analyzeQuestions(); return; }
          const vs = qs.map(q => vecCache.get(q.text));
          if (vs.some(v => !v)) { showToast("질문 관련도를 다시 계산합니다. 잠시 후 다시 눌러 주세요."); analyzeQuestions(); return; }
          const picked = mmrPick(qs.map(q => info[q.id].rel), (i, j) => cos(vs[i], vs[j]), Math.min(n, qs.length));
          setState({ selectedQuestionIds: picked.sort((a, b) => a - b).map(i => qs[i].id) });
          showToast(`관련도와 다양성을 고려해 ${picked.length}개를 골랐습니다.`);
        },

        // 지금까지의 모든 인터뷰 답변을 의미별로 묶고(임베딩), 묶음마다 제목·인사이트를 붙임(Flash)
        async buildAffinity() {
          const items = [];
          state.history.forEach((h, hi) => (h.result.qaPairs || []).forEach(qa => splitSentences(qa.a).forEach(t => items.push({ t, who: h.personaId, hi }))));
          // 같은 문장은 한 번만 묶되, 그 말을 한 사람은 모두 기억
          const uniq = []; const seen = new Map();
          items.forEach(x => { if (seen.has(x.t)) seen.get(x.t).who.add(x.who); else { const y = { t: x.t, who: new Set([x.who]) }; seen.set(x.t, y); uniq.push(y); } });
          const list = uniq.slice(0, 300);
          if (list.length < 6) { showToast("묶을 답변이 부족합니다. 인터뷰를 더 진행해 주세요."); return; }
          const res = await withLoading(`인터뷰 답변 ${list.length}문장을\n의미가 비슷한 것끼리 묶고 있습니다`, async () => {
            const vs = await embedTexts(list.map(x => x.t));
            const k = Math.max(3, Math.min(8, Math.round(Math.sqrt(list.length / 2))));
            const groups = clusterVectors(vs, k).filter(g => g.length >= 2).sort((a, b) => b.length - a.length);
            const clusters = groups.map((g, id) => {
              const c = meanVec(g.map(i => vs[i]));
              const ranked = [...g].sort((a, b) => cos(vs[b], c) - cos(vs[a], c));
              return { id, size: g.length, people: new Set(g.flatMap(i => [...list[i].who])).size, samples: ranked.slice(0, 6).map(i => list[i].t), rep: list[ranked[0]].t };
            });
            const named = await callGemini(PROMPTS.NAME_CLUSTERS(state.researchTopic, clusters), "Name the groups.");
            const byId = {}; ((named && named.clusters) || []).forEach(c => { byId[c.id] = c; });
            return {
              total: list.length,
              interviews: state.history.length,
              builtAt: Date.now(),
              clusters: clusters.map(c => ({ size: c.size, people: c.people, rep: c.rep, samples: c.samples.slice(1, 4), title: (byId[c.id] && byId[c.id].title) || `묶음 ${c.id + 1}`, insight: (byId[c.id] && byId[c.id].insight) || "" }))
            };
          });
          if (res) setState({ affinity: res });
        },

        async askFollowUp() {
          const input = document.getElementById('followup-input');
          const question = input?.value.trim(); if (!question) return;
          const curH = state.history[state.history.length - 1];
          const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === curH.personaId);
          const res = await withLoading("추가 질문에 대한 답변을 작성하는 중",
            () => callGemini(PROMPTS.GENERATE_FOLLOW_UP(state.researchTopic, persona, question), "Ask follow-up."));
          if (res) { const newH = [...state.history]; newH[newH.length-1].result.qaPairs.push(res); setState({ history: newH }); input.value = ""; }
        }
      };
      window.Actions = Actions;

      // --- CLIPBOARD UTILITY ---
      function copyReportToClipboard() {
        let txt = "==================================================\n   RESEARCH LAB. 분석 리포트\n==================================================\n\n";
        txt += `[1. 리서치 주제]\n- ${state.researchTopic || "설정된 주제 없음"}\n\n`;
        if (state.aiPersonas.length > 0 || state.manualPersonas.length > 0) {
          txt += `[2. 제안된 타겟 리스트]\n`;
          [...state.aiPersonas, ...state.manualPersonas].forEach((p, i) => {
            txt += `${i+1}. ${p.name}\n   - 설명: ${p.description}\n   - 주요니즈: ${p.needs}\n\n`;
          });
        }
        if (state.history.length > 0) {
          txt += `[3. 인터뷰 세션 기록]\n`;
          state.history.forEach((h, idx) => {
            const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === h.personaId);
            txt += `--- 인터뷰 #${idx+1} (${persona?.name}) ---\n요약: ${h.result.summary}\n`;
            h.result.qaPairs.forEach((qa, qidx) => { txt += `${qidx+1}. Q: ${qa.q}\n   A: ${qa.a}\n`; });
            txt += `인사이트:\n${h.result.keyInsights}\n\n`;
          });
        }
        
        if (state.affinity && state.affinity.clusters.length) {
          txt += `[4. 인사이트 묶음 (Affinity Map, 인터뷰 ${state.affinity.interviews}건)]\n`;
          state.affinity.clusters.forEach((c, i) => {
            txt += `${i+1}. ${c.title} (${c.people >= 2 ? c.people + "명 공통" : "1명의 강한 의견"}, ${c.size}문장)\n   - ${c.insight}\n   - 대표 발언: "${c.rep}"\n\n`;
          });
        }
        const textArea = document.createElement("textarea");
        textArea.value = txt;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("리포트가 클립보드에 복사되었습니다.");
        } catch (err) {
          showToast("복사 실패. 다시 시도해 주세요.");
        }
        document.body.removeChild(textArea);
      }
      window.copyReportToClipboard = copyReportToClipboard;

      function showToast(message) {
        const toast = document.createElement("div");
        toast.innerText = message;
        toast.className = "fixed left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-3 rounded-full text-sm font-bold z-[10000] animate-fade-in shadow-xl whitespace-nowrap";
        toast.style.bottom = "calc(112px + env(safe-area-inset-bottom))";

      window.showToast = showToast;

      function toggleQuestion(id) {

        newList = newList.includes(id) ? newList.filter(x => x !== id) : [...newList, id];
        setState({ selectedQuestionIds: newList });
      }
      window.toggleQuestion = toggleQuestion;

      // --- RENDERERS ---
      const TIER_CLS = { "높음": "bg-blue-600 text-white", "보통": "bg-blue-100 text-blue-700", "낮음": "bg-slate-100 text-slate-500" };
      function embedStatus() {
        return state.embedBusy ? `<p class="flex items-center gap-2 text-[13px] font-bold text-slate-500 mb-3" role="status"><span class="inline-block w-3 h-3 rounded-full border-2 border-blue-600 border-t-transparent animate-spin"></span>${esc(state.embedBusy)}</p>` : "";
      }
      function personaBadges(p) {
        const info = (state.personaInfo || {})[p.id];
        if (!info) return "";
        return `<div class="flex flex-wrap gap-1.5 mb-3">
          <span class="px-2.5 py-1 rounded-full text-[13px] font-black ${TIER_CLS[info.tier] || TIER_CLS["보통"]}">주제 적합도 ${esc(info.tier)} · ${info.score.toFixed(2)}</span>
          ${info.arch ? `<span class="px-2.5 py-1 rounded-full text-[13px] font-bold bg-amber-50 text-amber-700 border border-amber-200">성향 추정 · ${esc(info.arch)}</span>` : ""}
          ${info.dupWith ? `<span class="px-2.5 py-1 rounded-full text-[13px] font-bold bg-red-50 text-red-600 border border-red-200">${info.dupWith}번 타겟과 비슷함</span>` : ""}
        </div>`;
      }
      function questionBadges(qId) {
        const info = (state.questionInfo || {})[qId];
        if (!info) return "";
        const all = Object.values(state.questionInfo).map(x => x.rel).sort((a, b) => b - a);
        const r = all.indexOf(info.rel) / Math.max(1, all.length - 1);
        const tier = r <= 0.34 ? "높음" : r <= 0.67 ? "보통" : "낮음";
        let dupNo = "";
        if (info.dupWith) { const idx = allQuestions().findIndex(q => q.id === info.dupWith); if (idx >= 0) dupNo = `${idx + 1}번째 질문과 비슷함`; }
        return `<div class="flex flex-wrap gap-1.5 mt-2">
          <span class="px-2 py-0.5 rounded-full text-[13px] font-bold ${TIER_CLS[tier]}">관련도 ${tier}</span>
          ${dupNo ? `<span class="px-2 py-0.5 rounded-full text-[13px] font-bold bg-red-50 text-red-600 border border-red-200">${dupNo}</span>` : ""}
        </div>`;
      }
      function renderAffinity() {
        const a = state.affinity;
        const n = state.history.length;
        const stale = a && a.interviews !== n;

            content += `<div class="pt-[100px] px-5 dock-space animate-fade-in bg-white">
                ${renderHeader("인터뷰 확정", 4)}
                <h2 class="text-3xl font-black mb-5 tracking-tight text-slate-900">최종 확인</h2>
                <div class="bg-dark-navy p-6 rounded-[2rem] text-white shadow-xl">
                  <div class="mb-5 border-b border-white/10 pb-4"><h3 class="font-black text-2xl leading-tight">${selectedP?.name}</h3></div>
                  <div class="space-y-3 max-h-[50vh] overflow-y-auto pr-2 no-scrollbar font-medium">
                    ${finalQList.map((q, i) => `<div class="flex gap-4 text-base text-slate-300"><span class="font-bold text-blue-400 shrink-0">${i+1}.</span> <p>${q}</p></div>`).join('')}
                  </div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 px-5 pt-3 dock bg-white/95 backdrop-blur-md border-t border-slate-100 max-w-[430px] mx-auto z-[60]"><button onclick="Actions.performInterview()" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-lg btn-active shadow-lg">가상 인터뷰 진행하기</button></div>
              </div>`;
            break;

          case 6:
            const curH = state.history[state.history.length-1];
            const curPersona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === curH.personaId);
            content += `<div class="pt-[100px] px-5 dock-space-2 animate-fade-in bg-white">
                ${renderHeader("인터뷰 결과", 3)}
                <div class="mb-5 p-6 bg-dark-navy rounded-[2rem] text-white shadow-xl">
                    <h2 class="text-2xl font-black mb-3 leading-tight">${curPersona.name}님 리포트</h2>
                    <p class="text-slate-300 text-lg leading-relaxed whitespace-pre-line font-medium">${curH.result.summary}</p>
                </div>
                <div class="space-y-3 mb-5">
                  ${curH.result.qaPairs.map((qa, i) => `
                    <div class="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm animate-fade-in">
                      <div class="text-blue-600 font-black text-[11px] uppercase mb-2 tracking-widest flex items-center gap-2">Question</div>
                      <div class="text-slate-900 font-bold text-lg mb-4 leading-relaxed">${i+1}. ${qa.q}</div>
                      <div class="text-slate-400 font-black text-[11px] uppercase mb-2 tracking-widest flex items-center gap-2">Answer</div>
                      <div class="text-slate-700 font-medium text-lg leading-relaxed">${qa.a}</div>
                    </div>`).join('')}
                </div>
                <div class="p-4 bg-blue-50/50 border border-blue-100 rounded-3xl space-y-2.5 mb-5">
                    <h4 class="text-sm font-black text-blue-600 uppercase tracking-widest flex items-center gap-2">
                      <i data-lucide="sparkles" class="w-4 h-4"></i> 인터뷰 추가 질문
                    </h4>
                    <div class="flex items-center gap-2">
                      <input type="text" id="followup-input" onkeydown="if(event.key==='Enter' && !event.isComposing){event.preventDefault(); Actions.askFollowUp();}" class="flex-1 min-w-0 h-12 px-4 bg-white border border-blue-100 rounded-2xl text-base outline-none focus:ring-2 focus:ring-blue-500 font-medium" placeholder="예: 3번 대답의 000에 대해 자세한 설명">
                      <button onclick="Actions.askFollowUp()" aria-label="보내기" class="shrink-0 w-12 h-12 bg-blue-600 text-white rounded-2xl shadow-md flex items-center justify-center btn-active">
                        <i data-lucide="send" class="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>
                <div class="p-6 bg-blue-50 border border-blue-100 rounded-[2rem] shadow-inner mb-5">
                  <h3 class="text-blue-600 font-black text-sm uppercase tracking-widest mb-3 flex items-center gap-2"><i data-lucide="lightbulb" class="w-5 h-5"></i> Key Insights</h3>
                  <div class="text-slate-800 font-bold text-lg leading-relaxed whitespace-pre-line">${curH.result.keyInsights}</div>
                </div>
                ${renderAffinity()}
                <div class="fixed bottom-0 left-0 right-0 px-5 pt-3 dock bg-white/95 backdrop-blur-md border-t border-slate-100 max-w-[430px] mx-auto z-[60] space-y-2">
                  <button onclick="setState({step: 3})" class="w-full py-4 bg-white border-2 border-blue-600 text-blue-600 rounded-2xl font-black text-lg flex items-center justify-center gap-2 btn-active">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i> 다른 타겟 인터뷰하기
                  </button>
                  <button onclick="copyReportToClipboard()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-lg btn-active">리포트 복사 및 인터뷰 종료</button>
                </div>
              </div>`;
            break;
        }
        
        root.innerHTML = `<div class="w-full max-w-[430px] mx-auto min-h-screen shadow-2xl relative overflow-hidden">${content}</div>`;
        lucide.createIcons();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (state.errorMsg) setState({ errorMsg: null });
        else if (state.isAnalyzing) Actions.cancel();
      });

      // --- BOOTSTRAP ---
      // 5초 간격 자동 저장 (내용이 바뀐 경우에만) + 창을 닫을 때 저장
      setInterval(() => { try { persist(false); } catch (e) { console.warn("자동 저장 실패", e); } }, AUTOSAVE_MS);
      window.addEventListener("beforeunload", () => { try { persist(false); } catch (e) { /* 무시 */ } });
      document.addEventListener("visibilitychange", () => { if (document.hidden) { try { persist(false); } catch (e) { /* 무시 */ } } });

      /* 당겨서 새로고침 막기 (CSS overscroll-behavior를 무시하는 브라우저용 보조 장치)
         화면 맨 위에서 아래로 끌어내릴 때만 막고, 안쪽 스크롤 목록·입력창 스크롤은 그대로 둠 */
      (function blockPullToRefresh() {
        let startY = 0;
        document.addEventListener("touchstart", (e) => {
          if (e.touches.length === 1) startY = e.touches[0].clientY;
        }, { passive: true });
        document.addEventListener("touchmove", (e) => {
          if (e.touches.length !== 1) return;
          const pullingDown = e.touches[0].clientY - startY > 0;
          if (!pullingDown) return;
          const pageTop = (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
          if (!pageTop) return;
          // 손가락 아래에 위로 더 스크롤할 수 있는 영역이 있으면 그 영역의 스크롤은 허용
          for (let el = e.target; el && el !== document.body; el = el.parentElement) {
            if (el.scrollTop > 0) return;
          }
          if (e.cancelable) e.preventDefault();
        }, { passive: false });
      })();

      if (document.readyState === "complete") render();
      else window.addEventListener("load", render);

    })();
  </script>
</body>
</html>
