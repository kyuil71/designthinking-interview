<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Research Lab. | AI User Insight</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      background-color: #ffffff;
      font-size: 16px;
      color: #1e293b;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .bg-dark-navy { background-color: #0f172a; }
    .bg-quote-gray { background-color: #f8fafc; }
    .border-card { border-color: #f1f5f9; }
    .hero-title { font-size: 13.5vw; line-height: 1.0; }
    @media (min-width: 430px) { .hero-title { font-size: 58px; } }
    .btn-active:active { transform: scale(0.98); transition: all 0.1s; }
    
    .glass-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    (function() {
      // --- CONFIG & CONSTANTS ---
      const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
      const apiKey = ""; 
      const STORAGE_KEY = "research_lab_insight_final_v31";
      const SESSION_KEY_API = "research_lab_api_key_v31";

      // --- PROMPT TEMPLATES ---
      const PROMPTS = {
        GENERATE_PERSONAS: (topic) => `You are a Senior User Researcher. Topic: "${topic}". Suggest 8 diverse target personas. 
        [STYLE] Use clear, easy Korean suitable for college students. Avoid difficult jargon.
        [STRICT FORMATTING RULE]
        You MUST provide the persona data exactly as follows for each object:
        - "name": "[특성을 대표하는 표현의 인물] ([카테고리]): [연령대]"
        - "description": "[직업/라이프스타일/행동 패턴 등을 포함한 상세 설명]"
        - "needs": "[해결하고자 하는 구체적인 불편함이나 욕구]"
        Return JSON object: { "personas": [{ "id": "uuid", "name": "Name", "description": "Description", "needs": "Needs" }] }.`,
        
        GENERATE_SURVEYS: (topic, persona) => `You are an Expert Interviewer. Topic: "${topic}". Persona: "${persona.name}".
        Suggest exactly 15 interview questions organized into 3 categories (5 per category). 
        Return JSON: { "surveys": [{ "id": "uuid", "title": "Category Title", "questions": ["Question 1", "Question 2", "..."] }] }.`,

        GENERATE_INTERVIEW: (topic, persona, questions) => `You are a Virtual User named ${persona.name}. Topic: "${topic}". 
        Context: ${persona.description}. Needs: ${persona.needs}.
        Answer ALL the following questions realistically as this persona.
        Return JSON: { "summary": "Summary", "qaPairs": [{ "q": "Question Text", "a": "Answer Text" }], "keyInsights": "1) ... \\n 2) ..." }.`,

        GENERATE_FOLLOW_UP: (topic, persona, question) => `You are ${persona.name}. Topic: "${topic}". Answer follow-up: "${question}".
        Return JSON: { "q": "${question}", "a": "Answer" }.`,

        GENERATE_SYNTHESIS: (topic, history) => `You are a Lead Design Strategist. Analyze these interviews: ${JSON.stringify(history)}.
        Return JSON: { "totalAnalysis": "Synthesis in 1) 2) 3) format", "strategicPoints": [{ "tag": "Keyword", "title": "Strategy Name", "desc": "Explanation" }] }.`
      };

      // --- GLOBAL STATE ---
      let state = {
        apiKey: "", step: -1, maxStepReached: -1, researchTopic: "",
        aiPersonas: [], manualPersonas: [], selectedPersonaId: null,
        aiSurveys: [], manualSurveys: [], selectedQuestionIds: [], 
        history: [], finalSynthesis: null, isAnalyzing: false, errorMsg: null
      };

      // --- HELPERS ---
      function saveToLocal() { 
        const { isAnalyzing, errorMsg, ...rest } = state; 
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rest)); 
      }
      function checkSavedData() { return localStorage.getItem(STORAGE_KEY) !== null; }
      function resumeAnalysis() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) { 
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed, apiKey: sessionStorage.getItem(SESSION_KEY_API) || "" }; 
          window.state = state; 
          render(); 
        }
      }
      function setState(newState) {
        if (newState.step !== undefined) { 
          state.maxStepReached = Math.max(state.maxStepReached, newState.step); 
          window.scrollTo(0, 0); 
        }
        state = { ...state, ...newState }; 
        window.state = state; 
        render(); 
        if (state.step >= 0) saveToLocal();
      }

      async function callGemini(systemPrompt, userPrompt) {
        setState({ isAnalyzing: true, errorMsg: null });
        const currentKey = state.apiKey || apiKey;
        let delay = 1000;
        for (let i = 0; i < 5; i++) {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${currentKey}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
              })
            });
            if (!response.ok) throw new Error("API Request Failed");
            const data = await response.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            setState({ isAnalyzing: false });
            return JSON.parse(text);
          } catch (e) {
            if (i === 4) {
              setState({ isAnalyzing: false, errorMsg: "분석 중 오류가 발생했습니다." });
              return null;
            }
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
          }
        }
      }

      // --- ACTIONS ---
      async function validateAndStart(forcedKey = null) {
        const key = forcedKey !== null ? forcedKey : (document.getElementById('api-input')?.value || "");
        sessionStorage.setItem(SESSION_KEY_API, key); 
        state.apiKey = key;
        const test = await callGemini("Return JSON: {\"status\":\"OK\"}", "Test Connection");
        if (test) setState({ step: 0 }); 
        else alert("API 키가 올바르지 않거나 연결에 실패했습니다.");
      }

      async function generatePersonas(instruction = "") {
        const userPrompt = instruction ? `Topic: ${state.researchTopic}. Instruction: ${instruction}` : state.researchTopic;
        const res = await callGemini(PROMPTS.GENERATE_PERSONAS(state.researchTopic), userPrompt);
        if (res) setState({ aiPersonas: res.personas, step: 2 });
      }

      async function generateSurveys() {
        const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === state.selectedPersonaId);
        const res = await callGemini(PROMPTS.GENERATE_SURVEYS(state.researchTopic, persona), "Generate questions.");
        if (res) setState({ aiSurveys: res.surveys, step: 4 });
      }

      async function performInterview() {
        const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === state.selectedPersonaId);
        const allQ = []; 
        [...state.aiSurveys, ...state.manualSurveys].forEach(s => s.questions.forEach((q, idx) => allQ.push({ id: `${s.id}-${idx}`, text: q })));
        const selectedTexts = allQ.filter(q => state.selectedQuestionIds.includes(q.id)).map(q => q.text);
        if (selectedTexts.length === 0) { alert("질문을 선택해 주세요."); return; }
        const res = await callGemini(PROMPTS.GENERATE_INTERVIEW(state.researchTopic, persona, selectedTexts), "Start interview.");
        if (res) setState({ history: [...state.history, { personaId: persona.id, result: res }], step: 6 });
      }

      async function askFollowUp() {
        const input = document.getElementById('followup-input');
        const question = input?.value.trim(); if (!question) return;
        const curH = state.history[state.history.length - 1];
        const persona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === curH.personaId);
        const res = await callGemini(PROMPTS.GENERATE_FOLLOW_UP(state.researchTopic, persona, question), "Ask follow-up.");
        if (res) { 
          const newH = JSON.parse(JSON.stringify(state.history));
          newH[newH.length - 1].result.qaPairs.push(res); 
          setState({ history: newH }); 
          input.value = ""; 
        }
      }

      async function runSynthesis() {
        const historyData = state.history.map(h => {
          const p = [...state.aiPersonas, ...state.manualPersonas].find(x => x.id === h.personaId);
          return { name: p.name, summary: h.result.summary, insights: h.result.keyInsights, qa: h.result.qaPairs };
        });
        const res = await callGemini(PROMPTS.GENERATE_SYNTHESIS(state.researchTopic, historyData), "Synthesize results.");
        if (res) setState({ finalSynthesis: res, step: 7 });
      }

      // --- 통합 리포트 다운로드 로직 (단계별 데이터 누적) ---
      function downloadReport() {
        if (state.step < 0) return;

        let txt = `==================================================\n`;
        txt += `   RESEARCH LAB. COMPREHENSIVE REPORT\n`;
        txt += `   Created at: ${new Date().toLocaleString()}\n`;
        txt += `==================================================\n\n`;

        // 1. 리서치 주제 (Step 1 이상)
        if (state.researchTopic) {
          txt += `[1. 리서치 주제]\n- ${state.researchTopic}\n\n`;
        }

        // 2. 페르소나 리스트 (Step 2 이상)
        const allPersonas = [...state.aiPersonas, ...state.manualPersonas];
        if (allPersonas.length > 0) {
          txt += `[2. 제안된 타겟 페르소나 리스트]\n`;
          allPersonas.forEach((p, i) => {
            txt += `${i + 1}. ${p.name}\n   - 배경: ${p.description}\n   - 주요 니즈: ${p.needs}\n\n`;
          });
        }

        // 3. 선택된 인터뷰 대상 및 질문 (Step 3, 4, 5 이상)
        if (state.selectedPersonaId) {
          const selectedP = allPersonas.find(p => p.id === state.selectedPersonaId);
          txt += `[3. 현재 선택된 인터뷰 대상]\n- 대상: ${selectedP ? selectedP.name : '알 수 없음'}\n\n`;

          const allQuestions = [];
          [...state.aiSurveys, ...state.manualSurveys].forEach(s => 
            s.questions.forEach((q, idx) => allQuestions.push({ id: `${s.id}-${idx}`, text: q }))
          );
          const selectedQs = allQuestions.filter(q => state.selectedQuestionIds.includes(q.id));
          
          if (selectedQs.length > 0) {
            txt += `[4. 설계된 인터뷰 질문 리스트]\n`;
            selectedQs.forEach((q, i) => {
              txt += `   ${i + 1}) ${q.text}\n`;
            });
            txt += `\n`;
          }
        }

        // 4. 인터뷰 히스토리 (Step 6 이상)
        if (state.history.length > 0) {
          txt += `[5. 가상 인터뷰 진행 결과]\n`;
          state.history.forEach((h, i) => {
            const p = allPersonas.find(x => x.id === h.personaId);
            txt += `--------------------------------------------------\n`;
            txt += `대상 #${i + 1}: ${p ? p.name : '알 수 없음'}\n`;
            txt += `--------------------------------------------------\n`;
            txt += `■ 인터뷰 요약\n: ${h.result.summary}\n\n`;
            txt += `■ 질의응답 내역\n`;
            h.result.qaPairs.forEach((qa, j) => {
              txt += `   Q${j + 1}: ${qa.q}\n   A${j + 1}: ${qa.a}\n\n`;
            });
            txt += `■ 핵심 인사이트\n${h.result.keyInsights}\n\n`;
          });
        }

        // 5. 종합 전략 분석 (Step 7)
        if (state.finalSynthesis) {
          txt += `[6. 종합 전략 분석 및 권고안]\n`;
          txt += `■ 전체 리서치 요약\n${state.finalSynthesis.totalAnalysis}\n\n`;
          txt += `■ 전략적 추천 포인트\n`;
          state.finalSynthesis.strategicPoints.forEach((p, i) => {
            txt += `${i + 1}. [${p.tag}] ${p.title}\n   : ${p.desc}\n\n`;
          });
        }

        const blob = new Blob(["\ufeff" + txt], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Research_Lab_Full_Report_Step${state.step}.txt`;
        a.click();
      }

      function toggleQuestion(qId) {
        let newList = [...state.selectedQuestionIds];
        if (newList.includes(qId)) newList = newList.filter(id => id !== qId);
        else newList.push(qId);
        setState({ selectedQuestionIds: newList });
      }

      // --- RENDERERS ---
      function renderHeader(title, prevStep) {
        const canGoNext = state.step < state.maxStepReached;
        return `
          <header class="fixed top-0 left-0 right-0 z-50 glass-header border-b border-slate-100 px-6 h-16 flex items-center justify-between max-w-[430px] mx-auto">
            <div class="flex items-center gap-1">
              <button onclick="setState({step: ${prevStep}})" class="p-2 -ml-2 rounded-full hover:bg-slate-50 transition-all"><i data-lucide="chevron-left" class="w-7 h-7"></i></button>
              ${canGoNext ? `<button onclick="setState({step: ${state.step + 1}})" class="p-2 rounded-full hover:bg-slate-50 text-blue-600 transition-all"><i data-lucide="chevron-right" class="w-7 h-7"></i></button>` : ""}
              <h1 class="font-bold text-base truncate ml-1 font-black">${title}</h1>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="downloadReport()" title="현재 단계까지 모두 저장" class="p-2 rounded-full hover:bg-blue-50 text-blue-600 transition-all"><i data-lucide="download" class="w-6 h-6"></i></button>
              <button onclick="setState({step: 0})" class="p-2 rounded-full hover:bg-slate-50 text-slate-300 transition-all"><i data-lucide="home" class="w-6 h-6"></i></button>
            </div>
          </header>`;
      }

      function render() {
        const root = document.getElementById('root');
        let content = "";
        if (state.isAnalyzing) {
          content = `<div class="fixed inset-0 z-[9999] bg-white/95 backdrop-blur-md flex flex-col items-center justify-center p-8 text-center max-w-[430px] mx-auto animate-fade-in">
              <div class="w-16 h-16 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mb-8"></div>
              <p class="text-slate-900 font-normal text-2xl tracking-tighter">AI 분석 중</p>
            </div>`;
        }

        switch (state.step) {
          case -1:
            content += `<div class="min-h-screen flex flex-col items-center justify-center p-10 bg-white text-center">
                <div class="w-24 h-24 bg-blue-600 rounded-[2.5rem] flex items-center justify-center mb-10 shadow-xl btn-active"><i data-lucide="fingerprint" class="text-white w-12 h-12"></i></div>
                <div class="w-full px-2 mb-4"><h1 class="hero-title font-black italic tracking-tighter text-slate-900">Research Lab.</h1><h1 class="hero-title font-black italic tracking-tighter text-slate-900">Be Creative!</h1></div>
                <p class="text-slate-400 font-medium mb-12 text-sm">AI 기반 디자인 리서치 자동화 도구</p>
                <div class="w-full space-y-4">
                  <button onclick="validateAndStart('')" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-bold shadow-lg flex items-center justify-center gap-3 btn-active"><i data-lucide="zap" class="w-6 h-6 fill-white"></i> AI 환경에서 바로 시작하기</button>
                  <div class="flex items-center gap-4 py-4 opacity-20"><div class="flex-1 h-px bg-slate-400"></div><span class="text-xs font-bold uppercase tracking-widest text-slate-900">OR</span><div class="flex-1 h-px bg-slate-400"></div></div>
                  <input type="password" id="api-input" class="w-full p-5 bg-white border border-slate-200 rounded-2xl text-center focus:ring-2 focus:ring-blue-500 outline-none text-lg placeholder-slate-300 font-medium" placeholder="API KEY 입력">
                  <button onclick="validateAndStart()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-bold btn-active">API Key 입력 후 시작</button>
                </div>
              </div>`;
            break;

          case 0:
            content += `<div class="min-h-screen flex flex-col p-8 bg-dark-navy text-white">
                <div class="flex-1 flex flex-col justify-center space-y-10 animate-fade-in">
                  <div class="inline-block px-4 py-1.5 bg-blue-600 rounded-full text-[12px] font-black tracking-widest uppercase w-fit">Design Researcher AI</div>
                  <h1 class="text-5xl font-black leading-tight tracking-tighter">사용자의<br/>진심을<br/><span class="text-blue-500">발견하세요.</span></h1>
                  <p class="text-slate-400 text-lg leading-relaxed font-medium">디자인 리서치 전 과정을 AI가 돕습니다.<br/>주제 설정부터 인터뷰까지 단숨에 진행하세요.</p>
                </div>
                <div class="space-y-3 pb-10">
                  ${checkSavedData() ? `<button onclick="resumeAnalysis()" class="w-full py-5 bg-white/10 border border-white/20 text-white rounded-2xl font-bold btn-active">기존 프로젝트 계속 진행</button>` : ""}
                  <button onclick="setState({step: 1})" class="w-full py-6 bg-white text-slate-900 rounded-2xl font-black text-xl shadow-2xl flex items-center justify-center gap-2 btn-active">새 프로젝트 시작 <i data-lucide="arrow-right" class="w-6 h-6"></i></button>
                </div>
              </div>`;
            break;

          case 1:
            content += `<div class="pt-24 px-6 min-h-screen flex flex-col animate-fade-in bg-white">
                ${renderHeader("주제 설정", 0)}
                <div class="mb-10"><h2 class="text-3xl font-black mb-3 tracking-tight leading-tight text-slate-900">어떤 대상을<br/>탐구할까요?</h2><p class="text-slate-400 font-medium text-sm">분석하고 싶은 주제를 구체적으로 입력해 주세요.</p></div>
                <textarea id="topic-input" class="w-full h-64 p-6 bg-slate-50 border border-slate-100 rounded-[2.5rem] text-xl outline-none placeholder:text-slate-300 font-medium leading-relaxed" placeholder="예: 해외 여행을 계획할 때 스트레스를 느끼는 1인 가구">${state.researchTopic}</textarea>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]"><button onclick="const val = document.getElementById('topic-input').value; if(val){ setState({researchTopic: val}); generatePersonas(); }" class="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-2xl btn-active">타겟 제안받기</button></div>
              </div>`;
            break;

          case 2:
            content += `<div class="pt-24 px-6 pb-96 animate-fade-in bg-white">
                ${renderHeader("타겟 제안", 1)}
                <h2 class="text-3xl font-black mb-2 tracking-tight text-slate-900">이런 분들은 어떠신가요?</h2>
                <p class="text-blue-600 text-lg font-bold mb-10">주제와 가장 적합한 타겟 리스트입니다.</p>
                <div class="space-y-6 mb-12">
                  ${[...state.aiPersonas, ...state.manualPersonas].map((p, i) => `
                    <div class="p-8 bg-white border border-card rounded-[2.5rem] shadow-sm relative overflow-hidden transition-all animate-fade-in">
                      <h3 class="font-black text-[22px] text-slate-900 mb-6">${i+1}. ${p.name}</h3>
                      <p class="text-[17px] text-slate-700 font-medium mb-6 leading-relaxed whitespace-pre-line">${p.description}</p>
                      <div class="w-full bg-quote-gray p-4 rounded-[1.5rem] text-[18px] text-slate-600 font-medium italic border border-slate-100/50">
                        <span class="font-black text-slate-900 not-italic">- 주요니즈:</span> " ${p.needs} "
                      </div>
                    </div>`).join('')}
                </div>
                <div class="space-y-8 mb-24 transition-all">
                  <div class="p-6 bg-blue-50/50 border border-blue-100 rounded-[2.5rem] space-y-4">
                    <h4 class="text-sm font-black text-blue-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i> 타겟 수정 지시</h4>
                    <div class="flex gap-2 items-center">
                      <input type="text" id="persona-inst" class="flex-1 p-4 bg-white border border-blue-100 rounded-2xl text-base outline-none focus:ring-2 focus:ring-blue-500 font-medium" placeholder="예: 좀 더 소득 수준이 낮은 학생 위주로">
                      <button onclick="generatePersonas(document.getElementById('persona-inst').value)" class="shrink-0 p-4 bg-blue-600 text-white rounded-2xl shadow-lg btn-active"><i data-lucide="send" class="w-6 h-6"></i></button>
                    </div>
                  </div>
                  <div class="p-6 bg-slate-50 border border-slate-200/50 rounded-[2.5rem] space-y-5">
                    <h4 class="text-sm font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> 직접 타겟 추가</h4>
                    <input type="text" id="manual-p-name" class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-base font-bold outline-none" placeholder="이름 또는 제목">
                    <textarea id="manual-p-desc" class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-base h-32 outline-none" placeholder="상세 배경 및 니즈 정보"></textarea>
                    <button onclick="const n=document.getElementById('manual-p-name').value; const d=document.getElementById('manual-p-desc').value; if(n){ setState({manualPersonas: [...state.manualPersonas, {id: 'm'+Date.now(), name: n, description: d, needs: d}] }); document.getElementById('manual-p-name').value=''; document.getElementById('manual-p-desc').value=''; }" class="w-full py-4 bg-dark-navy text-white rounded-2xl font-black text-xl btn-active">리스트에 추가</button>
                  </div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]"><button onclick="setState({step: 3})" class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl shadow-2xl btn-active">다음: 인터뷰 대상 선택</button></div>
              </div>`;
            break;

          case 3:
            const selectable = [...state.aiPersonas, ...state.manualPersonas];
            content += `<div class="pt-24 px-6 pb-40 animate-fade-in bg-white">
                ${renderHeader("대상 선택", 2)}
                <h2 class="text-3xl font-black mb-8 tracking-tight text-slate-900">인터뷰를 진행할<br/>핵심 타겟을 골라주세요</h2>
                <div class="grid gap-5">
                  ${selectable.map(p => {
                    const isDone = state.history.some(h => h.personaId === p.id);
                    const isSel = state.selectedPersonaId === p.id;
                    return `<div onclick="${isDone ? '' : `setState({selectedPersonaId: '${p.id}'})`}" class="p-6 rounded-[2.5rem] border-2 transition-all cursor-pointer ${isDone ? 'opacity-40 bg-slate-50 border-slate-100' : (isSel ? 'border-blue-600 bg-blue-50 shadow-lg scale-[1.03]' : 'border-slate-100 bg-white hover:border-slate-200 shadow-sm')}">
                      <div class="flex items-center gap-4 mb-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${isSel ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}"><i data-lucide="user" class="w-5 h-5"></i></div>
                        <h3 class="font-black text-xl text-slate-900">${p.name} ${isDone ? '(완료)' : ''}</h3>
                      </div>
                      <p class="text-base text-slate-600 leading-relaxed font-medium">${p.description.substring(0, 85)}...</p>
                    </div>`;
                  }).join('')}
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white border-t max-w-[430px] mx-auto z-[60]"><button onclick="${state.history.length > 0 || state.aiSurveys.length > 0 ? 'setState({step: 4})' : 'generateSurveys()'}" ${!state.selectedPersonaId ? 'disabled' : ''} class="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-lg btn-active shadow-2xl disabled:opacity-30">인터뷰 시작하기</button></div>
              </div>`;
            break;

          case 4:
            content += `<div class="pt-24 px-6 pb-96 animate-fade-in bg-white">
                ${renderHeader("질문 설계", 3)}
                <h2 class="text-3xl font-black mb-4 tracking-tight text-slate-900">AI가 제안한 질문들입니다</h2>
                <p class="text-blue-600 text-lg font-bold mb-10">인터뷰 질문들을 개별 선택해 주세요.</p>
                <div class="space-y-12 mb-16">
                  ${state.aiSurveys.map(s => `
                    <div>
                      <h3 class="font-black text-xl text-slate-900 mb-6 flex items-center gap-3"><div class="w-2.5 h-6 bg-blue-600 rounded-full"></div> ${s.title}</h3>
                      <div class="space-y-4">
                        ${s.questions.map((q, idx) => {
                          const qId = `${s.id}-${idx}`; const isSel = state.selectedQuestionIds.includes(qId);
                          return `<div onclick="toggleQuestion('${qId}')" class="p-6 rounded-[1.5rem] border-2 transition-all cursor-pointer flex gap-4 ${isSel ? 'border-blue-600 bg-blue-50 shadow-md' : 'border-slate-100 bg-white shadow-sm'}">
                            <div class="w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 mt-1 ${isSel ? 'border-blue-600 bg-blue-600' : 'border-slate-200'} text-white">${isSel ? `<i data-lucide="check" class="w-4 h-4"></i>` : ""}</div>
                            <p class="text-base text-slate-800 font-bold flex-1">${q}</p>
                          </div>`;
                        }).join('')}
                      </div>
                    </div>`).join('')}
                </div>
                <div class="p-8 bg-slate-50 border border-slate-100 rounded-[2.5rem] space-y-6 shadow-sm">
                  <h4 class="text-sm font-black text-slate-500 uppercase tracking-widest flex items-center gap-2"><i data-lucide="plus" class="w-5 h-5"></i> 직접 질문 추가</h4>
                  <textarea id="manual-q-input" class="w-full p-5 bg-white border border-slate-200 rounded-2xl text-lg h-32 outline-none font-medium" placeholder="엔터로 구분하여 질문을 입력하세요"></textarea>
                  <button onclick="const v=document.getElementById('manual-q-input').value; if(v){ const list=v.split('\\n').filter(x=>x); const nid='m'+Date.now(); setState({manualSurveys: [...state.manualSurveys, {id:nid, title:'사용자 추가 질문', questions:list}], selectedQuestionIds:[...state.selectedQuestionIds, ...list.map((_,i)=>nid+'-'+i)]}); document.getElementById('manual-q-input').value=''; }" class="w-full py-5 bg-dark-navy text-white rounded-2xl font-black text-xl btn-active">질문에 추가</button>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]"><button onclick="if(state.selectedQuestionIds.length > 0) setState({step: 5})" ${state.selectedQuestionIds.length === 0 ? 'disabled' : ''} class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl shadow-2xl disabled:opacity-30 btn-active">선택 완료 (${state.selectedQuestionIds.length}개)</button></div>
              </div>`;
            break;

          case 5:
            const allQArr = []; [...state.aiSurveys, ...state.manualSurveys].forEach(s => s.questions.forEach((q, i) => allQArr.push({id:`${s.id}-${i}`, text:q})));
            const finalQ = allQArr.filter(q => state.selectedQuestionIds.includes(q.id));
            const selectedP = [...state.aiPersonas, ...state.manualPersonas].find(p=>p.id===state.selectedPersonaId);
            content += `<div class="pt-24 px-6 pb-44 animate-fade-in bg-white">
                ${renderHeader("인터뷰 확정", 4)}
                <h2 class="text-3xl font-black mb-10 tracking-tight text-slate-900">최종 확인</h2>
                <div class="bg-dark-navy p-8 rounded-[2.5rem] text-white shadow-2xl mb-12">
                  <div class="flex items-center gap-4 mb-8"><div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center font-bold text-xl">${selectedP?.name[0]}</div><h3 class="font-black text-2xl">${selectedP?.name}</h3></div>
                  <div class="space-y-5 max-h-80 overflow-y-auto pr-2 no-scrollbar border-t border-white/10 pt-8 font-medium">
                    ${finalQ.map((q, i) => `<div class="flex gap-4 text-base text-slate-300"><span class="font-bold text-blue-400">${i+1}.</span> <p>${q.text}</p></div>`).join('')}
                  </div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/95 border-t max-w-[430px] mx-auto z-[60]"><button onclick="performInterview()" class="w-full py-6 bg-blue-600 text-white rounded-2xl font-black text-xl btn-active shadow-2xl">가상 인터뷰 진행하기</button></div>
              </div>`;
            break;

          case 6:
            const curH = state.history[state.history.length-1];
            const curPersona = [...state.aiPersonas, ...state.manualPersonas].find(p => p.id === curH.personaId);
            content += `<div class="pt-24 px-6 pb-80 animate-fade-in bg-white">
                ${renderHeader("인터뷰 결과", 3)}
                <div class="mb-10 p-8 bg-dark-navy rounded-[2.5rem] text-white shadow-2xl">
                   <h2 class="text-2xl font-black mb-4 flex items-center gap-3"><i data-lucide="file-text" class="text-blue-400 w-7 h-7"></i> ${curPersona.name}님 리포트</h2>
                   <p class="text-slate-300 text-lg leading-relaxed whitespace-pre-line font-medium">${curH.result.summary}</p>
                </div>
                <div class="space-y-8 mb-16">
                  ${curH.result.qaPairs.map(qa => `
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm animate-fade-in">
                      <div class="text-blue-600 font-black text-[11px] uppercase mb-3 tracking-widest flex items-center gap-2">Question</div>
                      <div class="text-slate-900 font-bold text-lg mb-6 leading-relaxed">${qa.q}</div>
                      <div class="text-slate-400 font-black text-[11px] uppercase mb-3 tracking-widest flex items-center gap-2">Answer</div>
                      <div class="text-slate-700 font-medium text-lg leading-relaxed">${qa.a}</div>
                    </div>`).join('')}
                </div>
                <div class="p-6 bg-blue-50/50 border border-blue-100 rounded-[2.5rem] mb-12 flex gap-2 items-center">
                  <input type="text" id="followup-input" class="flex-1 p-4 bg-white border border-blue-200 rounded-2xl outline-none" placeholder="추가 질문을 입력하세요">
                  <button onclick="askFollowUp()" class="p-4 bg-blue-600 text-white rounded-2xl btn-active"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
                <div class="p-8 bg-blue-50 border border-blue-100 rounded-[2.5rem] mb-12 shadow-inner">
                  <h3 class="text-blue-600 font-black text-sm uppercase tracking-widest mb-6 flex items-center gap-2"><i data-lucide="lightbulb" class="w-6 h-6"></i> Key Insights</h3>
                  <div class="text-slate-800 font-bold text-lg leading-loose whitespace-pre-line">${curH.result.keyInsights}</div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-5 bg-white border-t max-w-[430px] mx-auto space-y-3 z-[60]">
                  <button onclick="setState({step: 3, selectedPersonaId: null})" class="w-full py-5 bg-white border-2 border-blue-600 text-blue-600 rounded-2xl font-black text-lg flex items-center justify-center gap-3 btn-active"><i data-lucide="user-plus" class="w-5 h-5"></i> 다른 고객 추가 인터뷰</button>
                  <button onclick="runSynthesis()" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-lg shadow-xl btn-active">인터뷰 완료 및 종합 분석</button>
                </div>
              </div>`;
            break;

          case 7:
            const fs = state.finalSynthesis;
            content += `<div class="pt-24 px-6 pb-44 animate-fade-in bg-white">
                ${renderHeader("종합 분석", 6)}
                <div class="mb-10 text-center">
                  <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><i data-lucide="award" class="w-10 h-10"></i></div>
                  <h2 class="text-3xl font-black tracking-tight leading-tight text-slate-900 italic">Research Synthesis</h2>
                </div>
                <div class="space-y-10">
                  <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm transition-all">
                    <h3 class="font-black text-blue-600 text-xs uppercase tracking-widest mb-6 flex items-center gap-2">Total Analysis</h3>
                    <p class="text-slate-800 font-medium text-lg leading-loose whitespace-pre-line">${fs.totalAnalysis}</p>
                  </div>
                  <div class="space-y-6">
                    <h3 class="font-black text-slate-400 text-xs uppercase tracking-[0.25em] px-4">Strategic Recommendations</h3>
                    ${fs.strategicPoints.map(p => `
                      <div class="bg-dark-navy p-8 rounded-[2.5rem] text-white shadow-xl relative animate-fade-in">
                        <span class="inline-block px-3 py-1 bg-blue-600 rounded-full text-[10px] font-black tracking-widest uppercase mb-4">${p.tag}</span>
                        <h4 class="text-xl font-black text-blue-400 mb-4 leading-tight">${p.title}</h4>
                        <div class="w-full h-px bg-white/10 mb-6"></div>
                        <p class="text-slate-300 text-lg leading-relaxed font-medium whitespace-pre-line">${p.desc}</p>
                      </div>`).join('')}
                  </div>
                </div>
                <div class="fixed bottom-0 left-0 right-0 p-6 bg-white border-t max-w-[430px] mx-auto z-[60]"><button onclick="downloadReport()" class="w-full py-6 bg-slate-900 text-white rounded-2xl font-black text-xl flex items-center justify-center gap-4 shadow-2xl btn-active"><i data-lucide="file-text" class="w-6 h-6"></i> 최종 리포트 저장 (TXT)</button></div>
              </div>`;
            break;
        }
        root.innerHTML = `<div class="w-full max-w-[430px] mx-auto min-h-screen shadow-2xl relative overflow-hidden">${content}</div>`;
        lucide.createIcons();
      }

      // --- EXPOSE ---
      window.state = state; 
      window.setState = setState; 
      window.validateAndStart = validateAndStart; 
      window.generatePersonas = generatePersonas;
      window.generateSurveys = generateSurveys; 
      window.performInterview = performInterview; 
      window.askFollowUp = askFollowUp;
      window.runSynthesis = runSynthesis; 
      window.downloadReport = downloadReport; 
      window.resumeAnalysis = resumeAnalysis;
      window.toggleQuestion = toggleQuestion; 
      window.onload = render;
    })();
  </script>
</body>
</html>
